<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" role="img" aria-label="Photo Date Restorer icon">
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2563eb"/>
      <stop offset="1" stop-color="#7c3aed"/>
    </linearGradient>
  </defs>
  <!-- rounded app tile -->
  <rect x="2" y="2" width="60" height="60" rx="14" fill="url(#g)"/>
  <!-- calendar body -->
  <rect x="14" y="16" width="36" height="34" rx="6" fill="#ffffff"/>
  <!-- calendar header -->
  <rect x="14" y="16" width="36" height="9" rx="6" fill="#e2e8f0"/>
  <rect x="14" y="22" width="36" height="3" fill="#e2e8f0"/>
  <!-- hangers -->
  <rect x="22" y="12" width="3.5" height="8" rx="1.75" fill="#ffffff"/>
  <rect x="38.5" y="12" width="3.5" height="8" rx="1.75" fill="#ffffff"/>
  <!-- photo mountains inside -->
  <path d="M19 44 L27 34 L33 41 L38 36 L45 44 Z" fill="#2563eb" opacity="0.18"/>
  <circle cx="40" cy="31" r="2.8" fill="#7c3aed" opacity="0.5"/>
  <!-- check mark badge -->
  <circle cx="46" cy="44" r="10" fill="#22c55e"/>
  <path d="M41.5 44 L45 47.5 L50.5 41" fill="none" stroke="#ffffff" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
