<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" role="img" aria-label="DateBack icon">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1C2735"/>
      <stop offset="1" stop-color="#0B0F14"/>
    </linearGradient>
    <linearGradient id="card" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#DFE5EC"/>
    </linearGradient>
    <linearGradient id="badge" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#5C9BF7"/>
      <stop offset="1" stop-color="#2F6FED"/>
    </linearGradient>
    <clipPath id="cardClip"><rect x="14" y="14" width="35" height="33" rx="6"/></clipPath>
  </defs>

  <!-- dark rounded tile -->
  <rect x="2" y="2" width="60" height="60" rx="14" fill="url(#bg)"/>

  <!-- photo card -->
  <rect x="14" y="14" width="35" height="33" rx="6" fill="url(#card)"/>
  <g clip-path="url(#cardClip)">
    <circle cx="40" cy="23.5" r="2.6" fill="#7C879A"/>
    <path d="M18.5,41 L28,29 L34,35 L39.5,28 L48,41 Z" fill="#5B6675"/>
  </g>

  <!-- blue restore badge -->
  <circle cx="46.5" cy="45.5" r="10.5" fill="#0B0F14" opacity="0.35"/>
  <circle cx="46.5" cy="44.5" r="10.5" fill="url(#badge)"/>
  <!-- white circular restore arrow -->
  <path d="M50.6,47.4 A5.2,5.2 0 1 1 50.3,41.1" fill="none" stroke="#FFFFFF" stroke-width="1.7" stroke-linecap="round"/>
  <path d="M52.5,47.8 L49.4,46.3 L51.1,49.6 Z" fill="#FFFFFF"/>
</svg>
