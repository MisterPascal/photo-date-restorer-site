<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 420" width="520" height="420" role="img" aria-label="Abstract preview: filenames with detected dates being restored and sorted in a gallery">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#12161B"/>
      <stop offset="1" stop-color="#0C0F13"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#4F8DF5"/>
      <stop offset="1" stop-color="#2F6FED"/>
    </linearGradient>
  </defs>

  <rect x="0" y="0" width="520" height="420" rx="8" fill="url(#bg)" stroke="#2E3742"/>

  <!-- LEFT: filename list with detected dates -->
  <text x="34" y="44" font-family="monospace" font-size="13" fill="#919AA6" font-weight="700">Detected from filename</text>

  <!-- row 1 -->
  <rect x="30" y="56" width="220" height="46" rx="5" fill="#161A20" stroke="#2E3742"/>
  <rect x="42" y="68" width="22" height="22" rx="4" fill="#4F8DF5" opacity="0.18"/>
  <path d="M46 86 l6-7 4 4 4-4 6 7Z" fill="#82B1F8" opacity="0.7"/>
  <text x="74" y="74" font-family="monospace" font-size="11" fill="#E9EDF2">IMG-20240510-WA0001.jpg</text>
  <text x="74" y="90" font-family="monospace" font-size="11" fill="#82B1F8" font-weight="700">&#8594; 2024-05-10</text>

  <!-- row 2 -->
  <rect x="30" y="112" width="220" height="46" rx="5" fill="#161A20" stroke="#2E3742"/>
  <rect x="42" y="124" width="22" height="22" rx="4" fill="#2F6FED" opacity="0.20"/>
  <path d="M46 142 l6-7 4 4 4-4 6 7Z" fill="#82B1F8" opacity="0.7"/>
  <text x="74" y="130" font-family="monospace" font-size="11" fill="#E9EDF2">VID-20231224-WA0032.mp4</text>
  <text x="74" y="146" font-family="monospace" font-size="11" fill="#82B1F8" font-weight="700">&#8594; 2023-12-24</text>

  <!-- row 3 -->
  <rect x="30" y="168" width="220" height="46" rx="5" fill="#161A20" stroke="#2E3742"/>
  <rect x="42" y="180" width="22" height="22" rx="4" fill="#4F8DF5" opacity="0.18"/>
  <path d="M46 198 l6-7 4 4 4-4 6 7Z" fill="#82B1F8" opacity="0.7"/>
  <text x="74" y="186" font-family="monospace" font-size="11" fill="#E9EDF2">IMG_20240510_143012.jpg</text>
  <text x="74" y="202" font-family="monospace" font-size="11" fill="#82B1F8" font-weight="700">&#8594; 2024-05-10</text>

  <!-- arrow -->
  <g>
    <line x1="262" y1="135" x2="300" y2="135" stroke="url(#accent)" stroke-width="4" stroke-linecap="round"/>
    <path d="M298 127 l12 8 -12 8Z" fill="#4F8DF5"/>
    <circle cx="286" cy="178" r="15" fill="#22c55e"/>
    <path d="M280 178 l4 4 7 -8" fill="none" stroke="#0C0F13" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- RIGHT: sorted gallery -->
  <text x="322" y="44" font-family="monospace" font-size="13" fill="#919AA6" font-weight="700">Gallery, correctly sorted</text>
  <g>
    <!-- gallery thumbs -->
    <rect x="322" y="56" width="78" height="62" rx="5" fill="#161A20" stroke="#2E3742"/>
    <path d="M330 110 l16-18 10 11 8-8 14 15Z" fill="#4F8DF5" opacity="0.35"/>
    <circle cx="380" cy="74" r="6" fill="#82B1F8" opacity="0.55"/>

    <rect x="408" y="56" width="78" height="62" rx="5" fill="#161A20" stroke="#2E3742"/>
    <path d="M416 110 l16-18 10 11 8-8 14 15Z" fill="#2F6FED" opacity="0.35"/>
    <circle cx="466" cy="74" r="6" fill="#4F8DF5" opacity="0.55"/>

    <rect x="322" y="126" width="78" height="62" rx="5" fill="#161A20" stroke="#2E3742"/>
    <path d="M330 180 l16-18 10 11 8-8 14 15Z" fill="#4F8DF5" opacity="0.35"/>
    <circle cx="380" cy="144" r="6" fill="#82B1F8" opacity="0.55"/>

    <rect x="408" y="126" width="78" height="62" rx="5" fill="#161A20" stroke="#2E3742"/>
    <path d="M416 180 l16-18 10 11 8-8 14 15Z" fill="#2F6FED" opacity="0.35"/>
    <circle cx="466" cy="144" r="6" fill="#4F8DF5" opacity="0.55"/>
  </g>

  <!-- bottom: preview-before-write bar -->
  <rect x="30" y="250" width="460" height="138" rx="6" fill="#161A20" stroke="#2E3742"/>
  <text x="50" y="280" font-family="sans-serif" font-size="14" fill="#E9EDF2" font-weight="700">Preview before changes</text>
  <text x="50" y="302" font-family="sans-serif" font-size="12" fill="#919AA6">100 of 312 photos &amp; videos ready · originals are never deleted</text>

  <!-- progress bar -->
  <rect x="50" y="318" width="400" height="12" rx="6" fill="#20262E"/>
  <rect x="50" y="318" width="128" height="12" rx="6" fill="url(#accent)"/>

  <!-- buttons -->
  <rect x="50" y="346" width="120" height="30" rx="5" fill="url(#accent)"/>
  <text x="110" y="366" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#ffffff" font-weight="700">Restore</text>
  <rect x="182" y="346" width="120" height="30" rx="5" fill="transparent" stroke="#2E3742"/>
  <text x="242" y="366" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#C3CAD3" font-weight="600">Preview</text>
</svg>
